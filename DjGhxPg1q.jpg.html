*{
margin:0;
padding:0;
box-sizing:border-box;
}




html,body{
background:#050505;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
overflow-x:hidden;
color:#fff;
}

 /* =================================================
       PENGATURAN POSISI BANNER
       ================================================= */

    :root {

      /* Banner ATAS */
      --banner-atas: 90px;

      /* Banner BAWAH
         0px = paling bawah video
         -30px = naik 30px
         -60px = naik 60px
      */
      --banner-bawah: 150px;

      /* Lebar maksimal video PC */
	  
	  
	  /* =================================================
       BANNER UMUM
       ================================================= */

    .banner {
      position: absolute;

      left: 50%;

      width: 100%;

      text-align: center;

      z-index: 999999;

      transform: translateX(-50%);

      pointer-events: auto;

      overflow: visible;
    }


    /* =================================================
       BANNER ATAS
       ================================================= */

    .banner-atas {
      top: var(--banner-atas);
    }


    /* =================================================
       BANNER BAWAH
       ================================================= */

    .banner-bawah {
      /*
        Posisi dihitung dari bagian bawah video
      */
      bottom: var(--banner-bawah);
    }

/* =================================================
   VIDEO BOX
================================================= */

.video-box {
  position: relative;
  width: 100%;
  background: #000;
}


/* =================================================
   TOMBOL PLAY TENGAH
================================================= */

#centerPlay {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 70px;
  height: 70px;

  border: 0;
  border-radius: 50%;

  background: #ff2f6d;

  cursor: pointer;

  z-index: 99999;

  box-shadow:
    0 8px 30px rgba(255, 0, 102, 0.45);

  transition: 0.2s ease;
}


/* HOVER */

#centerPlay:hover {
  transform:
    translate(-50%, -50%)
    scale(1.08);

  background: #ff0066;
}


/* =================================================
   ICON PLAY
================================================= */

#centerPlay::before {

  content: "";

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-35%, -50%);

  width: 0;
  height: 0;

  border-top:
    12px solid transparent;

  border-bottom:
    12px solid transparent;

  border-left:
    18px solid #fff;
}


/* =================================================
   SEMBUNYIKAN SAAT VIDEO PLAY
================================================= */

#centerPlay.hidden {

  opacity: 0;

  pointer-events: none;

}


/* =================================================
   MOBILE
================================================= */

@media (max-width: 480px) {

  #centerPlay {

    width: 60px;
    height: 60px;

  }

  #centerPlay::before {

    border-top-width: 10px;

    border-bottom-width: 10px;

    border-left-width: 15px;

  }

}

<script>
/* =================================================
   PLAY BUTTON
================================================= */

const player =
  document.getElementById("player");

const centerPlay =
  document.getElementById("centerPlay");


/* =================================================
   KLIK PLAY
================================================= */

centerPlay.addEventListener(
  "click",
  function () {

    if (player.paused) {

      player.play();

    } else {

      player.pause();

    }

  }
);


/* =================================================
   VIDEO MULAI
================================================= */

player.addEventListener(
  "play",
  function () {

    centerPlay.classList.add("hidden");

  }
);


/* =================================================
   VIDEO PAUSE
================================================= */

player.addEventListener(
  "pause",
  function () {

    centerPlay.classList.remove("hidden");

  }
);


/* =================================================
   VIDEO SELESAI
================================================= */

player.addEventListener(
  "ended",
  function () {

    centerPlay.classList.remove("hidden");

  }
);
</script>
